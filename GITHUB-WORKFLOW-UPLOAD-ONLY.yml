name: Build TimeTap ZIP on GitHub

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: unzip -q TimeTap-GitHub.zip -d extracted

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p extracted/TimeTap assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: TimeTap-debug-apk
          path: extracted/TimeTap/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
